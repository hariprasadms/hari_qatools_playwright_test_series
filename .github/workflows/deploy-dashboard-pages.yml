name: Deploy Playwright dashboard

on:
  push:
    branches: [main]
    paths:
      - 'test-dashboard/**'
      - '.github/workflows/deploy-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate test manifest
        run: node scripts/generate-test-manifest.mjs

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4